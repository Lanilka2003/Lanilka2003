<rect x="126" y="344" width="155" height="28" rx="14" fill="#c4b5fd" fill-opacity=".1" stroke="#c4b5fd" stroke-opacity=".55"/><text x="204" y="363" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#c4b5fd">Distributed Systems</text>
</g>
<rect x="12" y="12" width="376" height="406" rx="16" fill="none" stroke="#c4b5fd" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="0;-60" dur="3s" repeatCount="indefinite"/></rect>
<line x1="28" y1="390" x2="372" y2="390" stroke="#c4b5fd" stroke-opacity=".15"/>
<text x="28" y="414" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c4b5fd">View on GitHub <tspan class="arrow">→</tspan></text>
<text x="372" y="414" text-anchor="end" font-size="14" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">⭐</text>
</g>
<rect x="2" y="2" width="396" height="426" rx="23" fill="none" stroke="url(#border)" stroke-width="2" opacity="0.45"/>
</svg>