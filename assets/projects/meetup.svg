<rect x="199.0" y="124" width="11" height="9" rx="2" fill="#1e293b"/>
<rect x="181.0" y="108" width="11" height="9" rx="2" fill="#f9a8d4" class="wv"/>
<g class="pop"><rect x="214.0" y="82" width="80" height="32" rx="10" fill="#25d366"/><path d="M226.0,113 l-8,10 l14,-8z" fill="#25d366"/><path d="M225.0,98 l6,6 l12,-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="check"/><text x="250.0" y="103" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">Booked</text></g>
</g></g>
<g class="in" style="animation-delay:.2s"><rect x="300" y="22" width="76" height="24" rx="12" fill="#f9a8d4" fill-opacity=".15" stroke="#f9a8d4" stroke-opacity=".5"/><circle cx="313" cy="34" r="3.5" fill="#f9a8d4" class="dot"/><text x="322" y="38.5" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#f9a8d4">Ongoing</text></g>
<g class="in" style="animation-delay:.3s">
<text x="28" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#f9a8d4">Meetup Booking</text>
