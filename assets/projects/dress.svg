<style>
.grow { transform-box: fill-box; transform-origin: bottom center; animation: grow 4s ease-out infinite; }
@keyframes grow { 0% { transform: scaleY(.2) } 50%,100% { transform: scaleY(1) } }
.leaf { transform-box: fill-box; transform-origin: center; animation: leaf 4s ease-out infinite; }
@keyframes leaf { 0%,25% { transform: scale(0) } 55%,100% { transform: scale(1) } }
.drop { animation: drop 2s ease-in infinite; }
@keyframes drop { 0% { transform: translateY(-14px); opacity:0 } 30% { opacity:1 } 100% { transform: translateY(16px); opacity:0 } }
.check { stroke-dasharray: 40; animation: check 3s ease-out infinite; }
@keyframes check { 0%,30% { stroke-dashoffset: 40 } 55%,100% { stroke-dashoffset: 0 } }
.pop { transform-box: fill-box; transform-origin: left center; animation: pop 3s ease-out infinite; }
@keyframes pop { 0%,50% { transform: scale(0); opacity:0 } 65%,92% { transform: scale(1); opacity:1 } 100% { opacity:0 } }
.wv { animation: wv 1.8s ease-in-out infinite; } @keyframes wv { 50% { opacity:.15 } }
.arrow { animation: ar 1.6s ease-in-out infinite; } @keyframes ar { 50% { transform: translateX(6px) } }
.dot { animation: dt 1.4s ease-in-out infinite; } @keyframes dt { 50% { opacity:.25 } }
</style>
