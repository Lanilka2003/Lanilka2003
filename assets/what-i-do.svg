<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1a"/><stop offset=".6" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="330">
  <stop offset="0" stop-color="#38bdf8"/><stop offset=".33" stop-color="#1e3a8a"/><stop offset=".66" stop-color="#475569"/><stop offset="1" stop-color="#38bdf8"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 600.0 165.0" to="360 600.0 165.0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="title" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="420" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bae6fd"/><stop offset="1" stop-color="#ffffff"/>
